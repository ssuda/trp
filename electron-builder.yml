productName: SpinBi ERP
appId: com.spinbi.trp
copyright: Copyright © 2020 SpinBi Technologies,
win:
  target:
      - target: nsis
        arch:
          - x64
nsis:
  perMachine: true
  oneClick: true
  license: eula.txt

publish:
  provider: s3
  bucket: spinbi-trp
  endpoint: https://s3.ap-south-1.amazonaws.com
  region: ap-south-1

afterSign: build/notarize.js
snap:
  publish:
    - github
mac:
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
